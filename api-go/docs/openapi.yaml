openapi: 3.0.3
info:
  title: Food Delivery API
  version: 0.1.0

servers:
  - url: /

paths:
  /health:
    get:
      tags: [Health]
      summary: Check API and database connectivity
      responses:
        "200":
          description: Database is reachable
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
        "503":
          description: Database is unavailable

  /auth/register:
    post:
      tags: [Auth]
      summary: Register an account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, password_confirm]
              properties:
                email:
                  type: string
                  format: email
                  example: test@example.com
                password:
                  type: string
                  format: password
                password_confirm:
                  type: string
                  format: password
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                message: user created
        "400": { description: Invalid request or passwords do not match }
        "409": { description: Email already registered }
        "500": { description: Could not create user }

  /auth/login:
    post:
      tags: [Auth]
      summary: Log in and receive an access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [Email, password]
              properties:
                Email:
                  type: string
                  format: email
                  example: test@example.com
                password:
                  type: string
                  format: password
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                required: [access_token, token_type]
                properties:
                  access_token:
                    type: string
                  token_type:
                    type: string
                    example: Bearer
        "400": { description: Email or password is missing }
        "401": { description: Invalid email or password }
        "500": { description: Could not log in }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the current access token
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Logout successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                message: logout success
        "401": { description: Token is missing, invalid, expired, or revoked }
        "500": { description: Could not log out }
        "503": { description: Could not check token status }

  /auth/change-password:
    post:
      tags: [Auth]
      summary: Change the password for the authenticated user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [old_password, new_password]
              properties:
                old_password:
                  type: string
                  format: password
                new_password:
                  type: string
                  format: password
      responses:
        "204": { description: Password changed }
        "400": { description: Invalid request or current password is incorrect }
        "401": { description: Token is missing, invalid, expired, or revoked }
        "409": { description: Password changed during the request }
        "500": { description: Could not change password }
        "503": { description: Could not check token status }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Message:
      type: object
      required: [message]
      properties:
        message:
          type: string
