openapi: 3.0.3
info:
  title: Food Delivery API
  version: 0.1.0

servers:
  - url: /

paths:
  /health:
    get:
      tags: [Health]
      summary: Check API and database connectivity
      responses:
        "200":
          description: Database is reachable
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
        "503":
          description: Database is unavailable

  /auth/register:
    post:
      tags: [Auth]
      summary: Register an account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, password_confirm]
              properties:
                email:
                  type: string
                  format: email
                  example: test@example.com
                password:
                  type: string
                  format: password
                password_confirm:
                  type: string
                  format: password
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                message: user created
        "400": { description: Invalid request or passwords do not match }
        "409": { description: Email already registered }
        "500": { description: Could not create user }

  /auth/login:
    post:
      tags: [Auth]
      summary: Log in and receive an access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [Email, password]
              properties:
                Email:
                  type: string
                  format: email
                  example: test@example.com
                password:
                  type: string
                  format: password
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                required: [access_token, token_type]
                properties:
                  access_token:
                    type: string
                  token_type:
                    type: string
                    example: Bearer
        "400": { description: Email or password is missing }
        "401": { description: Invalid email or password }
        "500": { description: Could not log in }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the current access token
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Logout successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                message: logout success
        "401": { description: Token is missing, invalid, expired, or revoked }
        "500": { description: Could not log out }
        "503": { description: Could not check token status }

  /auth/change-password:
    post:
      tags: [Auth]
      summary: Change the password for the authenticated user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [old_password, new_password]
              properties:
                old_password:
                  type: string
                  format: password
                new_password:
                  type: string
                  format: password
      responses:
        "204": { description: Password changed }
        "400": { description: Invalid request or current password is incorrect }
        "401": { description: Token is missing, invalid, expired, or revoked }
        "409": { description: Password changed during the request }
        "500": { description: Could not change password }
        "503": { description: Could not check token status }
  /orders:
    get:
      tags: [Orders]
      summary: List orders with optional filters
      description: Filters use exact matches and are combined with AND.
      security:
        - bearerAuth: []
      parameters:
        - name: pageindex
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pagesize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: cuisine_category
          in: query
          schema: { type: string }
        - name: order_id
          in: query
          schema: { type: string }
        - name: metro_city
          in: query
          schema: { type: string }
          example: Tokyo
        - name: order_channel
          in: query
          schema: { type: string }
      responses:
        "200":
          description: List of matching orders
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    order_id: { type: string, nullable: true }
                    metro_city: { type: string }
                    cuisine_category: { type: string }
                    order_channel: { type: string }
                    order_value_usd: { type: number }
                    customer_rating: { type: number, nullable: true }
        "400": { description: Invalid pagination }
        "401": { description: Missing, invalid, expired, or revoked token }
        "500": { description: Could not load orders }
        "503": { description: Could not check token status }

  /orders/{id}:
    get:
      tags: [Orders]
      summary: Get order details by order ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: The order_id value from the orders list.
          schema: { type: string }
          example: ord_02fb1f942abf
      responses:
        "200": { description: Order details }
        "400": { description: Order ID is required }
        "401": { description: Missing, invalid, expired, or revoked token }
        "404": { description: Order not found }
        "500": { description: Could not load order }
        "503": { description: Could not check token status }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Message:
      type: object
      required: [message]
      properties:
        message:
          type: string
