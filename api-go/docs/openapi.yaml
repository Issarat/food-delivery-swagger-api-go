openapi: 3.0.3
info:
  title: Food Delivery API
  version: 0.1.0
servers:
  - url: /
paths:
  /orders:
    get:
      summary: List orders
      parameters:
        - name: pageindex
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pagesize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200": { description: Order list }
        "400": { description: Invalid pagination }
  /orders/{id}:
    get:
      summary: Get an order by order ID
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          example: ord_02fb1f942abf
      responses:
        "200": { description: Order found }
        "404": { description: Order not found }
